<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante - Cardápio e Pedidos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background-color: #1e293b; padding: 15px 30px; border-radius: 12px; margin-bottom: 20px; }
        h1 { color: #34d399; margin: 0; font-size: 24px; }
        .voltar { color: #94a3b8; text-decoration: none; font-size: 14px; }
        .voltar:hover { color: white; }
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .cardapio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .item-cardapio { background-color: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; text-align: center; }
        .item-cardapio h3 { margin: 10px 0 5px 0; color: #f8fafc; }
        .preco { color: #34d399; font-weight: bold; margin-bottom: 10px; }
        .carrinho { background-color: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; height: fit-content; }
        .carrinho h2 { margin-top: 0; color: #34d399; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        button { width: 100%; padding: 10px; background-color: #34d399; color: #0f172a; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #059669; }
        .btn-add { background-color: #3b82f6; color: white; }
        .btn-add:hover { background-color: #2563eb; }
        ul { padding-left: 20px; color: #cbd5e1; }
    </style>
</head>
<body>

    <header>
        <h1>Cardápio & Pedidos</h1>
        <a href="comandas.html" class="voltar">← Voltar às Comandas</a>
    </header>

    <div class="container">
        <div>
            <h2>Escolha os Itens</h2>
            <div class="cardapio-grid">
                <div class="item-cardapio">
                    <h3>🍔 Cheeseburger</h3>
                    <div class="preco">R$ 25,00</div>
                    <button class="btn-add" onclick="adicionarPedido('Cheeseburger', 25)">Adicionar</button>
                </div>
                <div class="item-cardapio">
                    <h3>🍟 Batata Frita</h3>
                    <div class="preco">R$ 15,00</div>
                    <button class="btn-add" onclick="adicionarPedido('Batata Frita', 15)">Adicionar</button>
                </div>
                <div class="item-cardapio">
                    <h3>🥤 Refrigerante</h3>
                    <div class="preco">R$ 8,00</div>
                    <button class="btn-add" onclick="adicionarPedido('Refrigerante', 8)">Adicionar</button>
                </div>
                <div class="item-cardapio">
                    <h3>🍕 Pizza Margherita</h3>
                    <div class="preco">R$ 45,00</div>
                    <button class="btn-add" onclick="adicionarPedido('Pizza Margherita', 45)">Adicionar</button>
                </div>
            </div>
        </div>

        <div class="carrinho">
            <h2>Pedido Atual</h2>
            <ul id="lista-pedido">
                <li>Nenhum item adicionado</li>
            </ul>
            <p><strong>Total:</strong> <span id="total-pedido">R$ 0,00</span></p>
            <button onclick="enviarPedido()">Confirmar e Enviar</button>
        </div>
    </div>

    <script>
        let itensCarrinho = [];
        let valorTotal = 0;

        function adicionarPedido(nome, preco) {
            itensCarrinho.push(nome);
            valorTotal += preco;
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            const lista = document.getElementById('lista-pedido');
            const total = document.getElementById('total-pedido');
            
            if (itensCarrinho.length === 0) {
                lista.innerHTML = '<li>Nenhum item adicionado</li>';
            } else {
                lista.innerHTML = itensCarrinho.map(item => `<li>${item}</li>`).join('');
            }
            
            total.textContent = `R$ ${valorTotal.toFixed(2)}`;
        }

        function enviarPedido() {
            if (itensCarrinho.length === 0) {
                alert('Adicione pelo menos um item antes de enviar!');
                return;
            }
            alert('Pedido enviado com sucesso para a cozinha!');
            itensCarrinho = [];
            valorTotal = 0;
            atualizarCarrinho();
        }
    </script>

</body>
</html>
